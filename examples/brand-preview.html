<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONWILO · 图标资源预览</title>
  <link rel="icon" href="../public/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f8; color: #173448; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1080px; margin: auto; padding: 48px 24px; }
    h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -.04em; }
    p { line-height: 1.7; }
    .intro { color: #597080; margin-bottom: 32px; }
    .themes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    section { padding: 28px; border-radius: 20px; background: #f0fbfa; border: 1px solid #dce7e7; }
    section.dark { background: #08314b; color: #f4fafb; border-color: #08314b; }
    h2 { margin: 0 0 20px; font-size: 18px; font-weight: 600; }
    .hero { display: block; width: min(100%, 320px); height: auto; margin: 0 auto 24px; border-radius: 22%; }
    .sizes { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px; min-height: 125px; }
    figure { margin: 0; text-align: center; }
    figure img { display: block; margin: auto; border-radius: 20%; }
    figcaption { margin-top: 9px; font-size: 12px; opacity: .75; }
    .maskable { display: flex; align-items: center; gap: 20px; margin-top: 28px; padding-top: 20px; border-top: 1px solid #ccdedd; }
    .dark .maskable { border-color: #33556b; }
    .maskable img { width: 96px; height: 96px; border-radius: 50%; }
    .maskable p { font-size: 13px; max-width: 190px; opacity: .8; }
    footer { margin-top: 28px; color: #597080; font-size: 13px; }
    a { color: inherit; }
    @media (max-width: 680px) { .themes { grid-template-columns: 1fr; } main { padding: 28px 16px; } }
  </style>
</head>
<body>
<main>
  <h1>ONWILO <span style="font-weight:400">· 由行</span></h1>
  <p class="intro">按自己的节奏，去喜欢的地方。<br>已确认的第六版图案 · PNG / ICO 图标资源</p>
  <div class="themes">
    <section>
      <h2>浅色主题</h2>
      <img class="hero" src="../public/brand/light/onwilo-512.png" width="320" height="320" alt="浅色 ONWILO 图标">
      <div class="sizes">
        <figure><img src="../public/brand/light/onwilo-16.png" width="16" height="16" alt="16 像素"><figcaption>16 px</figcaption></figure>
        <figure><img src="../public/brand/light/onwilo-32.png" width="32" height="32" alt="32 像素"><figcaption>32 px</figcaption></figure>
        <figure><img src="../public/brand/light/onwilo-64.png" width="64" height="64" alt="64 像素"><figcaption>64 px</figcaption></figure>
        <figure><img src="../public/brand/light/onwilo-128.png" width="96" height="96" alt="96 CSS 像素"><figcaption>96 px</figcaption></figure>
      </div>
      <div class="maskable">
        <img src="../public/brand/light/onwilo-maskable-192.png" width="96" height="96" alt="圆形裁切的浅色 maskable 图标">
        <p>maskable 版本的圆形裁切预览，四周留白供系统裁切。</p>
      </div>
    </section>
    <section class="dark">
      <h2>深色主题</h2>
      <img class="hero" src="../public/brand/dark/onwilo-512.png" width="320" height="320" alt="深色 ONWILO 图标">
      <div class="sizes">
        <figure><img src="../public/brand/dark/onwilo-16.png" width="16" height="16" alt="16 像素"><figcaption>16 px</figcaption></figure>
        <figure><img src="../public/brand/dark/onwilo-32.png" width="32" height="32" alt="32 像素"><figcaption>32 px</figcaption></figure>
        <figure><img src="../public/brand/dark/onwilo-64.png" width="64" height="64" alt="64 像素"><figcaption>64 px</figcaption></figure>
        <figure><img src="../public/brand/dark/onwilo-128.png" width="96" height="96" alt="96 CSS 像素"><figcaption>96 px</figcaption></figure>
      </div>
      <div class="maskable">
        <img src="../public/brand/dark/onwilo-maskable-192.png" width="96" height="96" alt="圆形裁切的深色 maskable 图标">
        <p>maskable 版本的圆形裁切预览，四周留白供系统裁切。</p>
      </div>
    </section>
  </div>
  <footer>方形源文件保留完整底图；此页只用 CSS 模拟圆角和圆形裁切。接入说明见 <a href="../README.md">README</a>。</footer>
</main>
</body>
</html>
